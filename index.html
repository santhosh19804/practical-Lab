<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Learning Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    header {
      background: #2c3e50;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .categories {
      display: flex;
      justify-content: center;
      gap: 1rem;
      background: #ecf0f1;
      padding: 1rem;
    }
    .categories button {
      padding: 0.5rem 1rem;
      border: none;
      background: #3498db;
      color: #fff;
      cursor: pointer;
      border-radius: 5px;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }
    .course-card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .course-card h3 {
      margin: 0 0 0.5rem;
    }
    .course-info {
      font-size: 0.9rem;
      color: #555;
    }
    .enroll-btn {
      margin-top: 1rem;
      padding: 0.5rem;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Learning Platform</h1>
  </header>

  <section class="categories">
    <button>Programming</button>
    <button>Design</button>
    <button>Marketing</button>
    <button>Business</button>
  </section>

  <section class="course-grid">
    <div class="course-card">
      <h3>Intro to Python</h3>
      <p class="course-info">Instructor: John Doe</p>
      <p class="course-info">Duration: 6 weeks</p>
      <p class="course-info">Price: $99</p>
      <button class="enroll-btn">Enroll Now</button>
    </div>

    <div class="course-card">
      <h3>UI/UX Design Basics</h3>
      <p class="course-info">Instructor: Jane Smith</p>
      <p class="course-info">Duration: 4 weeks</p>
      <p class="course-info">Price: $79</p>
      <button class="enroll-btn">Enroll Now</button>
    </div>

    <div class="course-card">
      <h3>Digital Marketing 101</h3>
      <p class="course-info">Instructor: Alex Brown</p>
      <p class="course-info">Duration: 5 weeks</p>
      <p class="course-info">Price: $89</p>
      <button class="enroll-btn">Enroll Now</button>
    </div>
  </section>
</body>
</html>
